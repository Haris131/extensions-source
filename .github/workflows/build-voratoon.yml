name: Build VoraToon

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build extension
        run: ./gradlew :src:id:komikcast:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: komikcast-voratoon
          path: src/id/komikcast/build/outputs/apk/release/*.apk