name: Build 3600000 Beauty

on:
  push:
    paths:
      - 'src/all/beauty3600000/**'
      - '.github/workflows/build-beauty3600000.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build extension
        run: ./gradlew :src:all:beauty3600000:assembleRelease

      - name: Lint extension
        run: ./gradlew :src:all:beauty3600000:lintRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beauty3600000
          path: src/all/beauty3600000/build/outputs/apk/release/*.apk
          if-no-files-found: error
